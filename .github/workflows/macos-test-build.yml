name: macOS installer

on:
  workflow_dispatch:
    inputs:
      standalone_only:
        description: Build a signed and notarized permission-test app ZIP without an installer
        type: boolean
        default: false
      test_source_ref:
        description: Optional source ref already merged into main for the standalone comparison build
        type: string
        default: ''
      signed_release:
        description: Sign, notarize, and enable signed updates
        type: boolean
        default: false
  workflow_call:
    inputs:
      signed_release:
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATES_P12:
        required: false
      APPLE_CERTIFICATES_PASSWORD:
        required: false
      APPLE_API_PRIVATE_KEY:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_ISSUER:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.standalone_only != true
    runs-on: macos-15
    timeout-minutes: 150
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signing source is merged into main
        if: inputs.signed_release
        run: python scripts/verify_signing_source.py
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/configure-macos-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: installer-complete-v1
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: false
          save-if: ${{ github.ref_type != 'tag' }}
      - name: Verify target and application versions
        id: metadata
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          version=$(python scripts/release_candidate.py version)
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:scripts
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features terminal --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features cli --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - uses: ./.github/actions/restore-runtime-downloads
        id: downloads
      - name: Stage verified macOS runtimes
        run: python scripts/prepare_runtime.py
      - name: Verify shared desktop and console CLI with isolated real services
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin fairway --bin fairway-cli --locked
          python tests/shared_cli_smoke.py --cli src-tauri/target/debug/fairway-cli --peer src-tauri/target/debug/fairway --runtime src-tauri/resources/runtime
      - name: Verify native fnm and isolated Node activation
        run: cargo run --manifest-path src-tauri/Cargo.toml --example node_tools_smoke --no-default-features --features terminal --locked -- "$PWD/.runtime-work/fnm-check"
      - name: Collect exact sources before signing or installer tests
        run: python scripts/package_sources.py --locked
      - uses: actions/cache/save@v5
        if: github.ref_type != 'tag' && steps.downloads.outputs.cache-hit != 'true'
        with:
          path: .runtime-cache
          key: ${{ steps.downloads.outputs.key }}
      - name: Verify persistent PHP settings and real uploads
        run: cargo run --manifest-path src-tauri/Cargo.toml --example php_settings_smoke --no-default-features --locked -- .runtime-work/php-settings-smoke
      - name: Verify PHP client extensions and Unix worker support
        run: cargo run --manifest-path src-tauri/Cargo.toml --example php_extension_smoke --no-default-features --locked -- .runtime-work/php-extension-smoke
      - name: Verify PHP clients with an external PostgreSQL test server
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install postgresql@17
          python3 scripts/check_postgres_clients.py --postgres-bin "$(brew --prefix postgresql@17)/bin"
      - name: Build native terminal test bridge
        run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --features terminal --example terminal_bridge --locked
      - run: npx playwright install --only-shell chromium
      - name: Exercise native terminal, data browser and logs through browser input
        env:
          FAIRWAY_NATIVE_ONLY: '1'
          FAIRWAY_TEST_RUNTIME: ${{ github.workspace }}/src-tauri/resources/runtime
        run: npx playwright test tests/ui/terminal-native.spec.ts tests/ui/data-browser-native.spec.ts tests/ui/sqlite-browser-native.spec.ts tests/ui/schema-details-native.spec.ts tests/ui/logs-native.spec.ts tests/ui/php-settings-native.spec.ts --project chromium --workers=1
      - name: Save native desktop browser report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-desktop-macos-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Exercise real services, backup restoration and PHP versions
        run: cargo run --manifest-path src-tauri/Cargo.toml --example smoke --no-default-features --locked -- "$PWD/.runtime-work/macos-smoke"
      - name: Recover web services after a force-killed controller
        run: cargo run --manifest-path src-tauri/Cargo.toml --example service_recovery_smoke --no-default-features --locked
      - name: Exercise native data browser and SQL export/import
        run: cargo run --manifest-path src-tauri/Cargo.toml --example data_browser_smoke --no-default-features --locked -- "$PWD/.runtime-work/data-browser-smoke"
      - name: Exercise SQLite project files without services
        run: cargo run --manifest-path src-tauri/Cargo.toml --example sqlite_browser_smoke --no-default-features --locked -- "$PWD/.runtime-work/sqlite-browser-smoke"
      - name: Verify SQLite workers across staged PHP versions
        run: python3 -m unittest discover -s tests -p test_sqlite_browser.py -v
      - name: Prepare installer lifecycle probe and baseline before signing
        run: |
          python scripts/fetch_installer_baseline.py macos --output .runtime-work/baseline-macos.pkg
          cargo build --release --example installer_probe --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Build native updater probe
        if: inputs.signed_release
        run: cargo build --release --example updater_probe --manifest-path src-tauri/Cargo.toml --locked
      - name: Fetch pinned dependencies and build native address helper
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
          python scripts/build_macos_hosts_helper.py --team-id 4Q27NQ2UAF --output artifacts/hosts-helper
      - name: Build release app with updater
        if: inputs.signed_release
        run: |
          python scripts/configure_release.py --public-key packaging/updater.pub
          npm run tauri -- build --bundles app --features native-macos-trust,native-macos-hosts --config artifacts/tauri.release.json --no-sign
          ditto artifacts/hosts-helper/Library 'src-tauri/target/release/bundle/macos/Fairway XMP.app/Contents/Library'
      - name: Build unsigned development app
        if: ${{ !inputs.signed_release }}
        run: |
          npm run tauri -- build --bundles app --features native-macos-trust,native-macos-hosts
          ditto artifacts/hosts-helper/Library 'src-tauri/target/release/bundle/macos/Fairway XMP.app/Contents/Library'
      - name: Transfer unsigned app and lifecycle inputs
        shell: bash
        run: |
          extra=()
          if [ '${{ inputs.signed_release }}' = true ]; then
            extra=(src-tauri/target/release/examples/updater_probe)
          fi
          tar -czf artifacts/macos-build-inputs.tar.gz 'src-tauri/target/release/bundle/macos/Fairway XMP.app' src-tauri/target/release/examples/installer_probe .runtime-work/baseline-macos.pkg artifacts/sources-*/fairway-xmp-*-bundled-tool-sources.tar.gz "${extra[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: macos-build-inputs
          path: artifacts/macos-build-inputs.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Save build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-build-diagnostics
          path: .runtime-work/macos-smoke/student data/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    needs: build
    if: inputs.standalone_only != true
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked signing tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify signing source is merged into main
        if: inputs.signed_release
        run: python scripts/verify_signing_source.py --expected ${{ needs.build.outputs.commit }}
      - uses: actions/download-artifact@v7
        with:
          name: macos-build-inputs
          path: artifacts
      - name: Restore unsigned app and lifecycle inputs
        run: tar -xzf artifacts/macos-build-inputs.tar.gz
      - name: Import release signing credentials
        if: inputs.signed_release
        env:
          APPLE_CERTIFICATES_P12: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/import_apple_credentials.sh
      - name: Sign and notarize app and installer
        if: inputs.signed_release
        env:
          FAIRWAY_SIGNED_RELEASE: '1'
          FAIRWAY_DEFER_RUNTIME_CHECKS: '1'
          FAIRWAY_DEFER_UPDATER_SIGNATURE: '1'
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Ei Maung (4Q27NQ2UAF)'
          APPLE_INSTALLER_IDENTITY: 'Developer ID Installer: Ei Maung (4Q27NQ2UAF)'
        run: sh scripts/package_macos.sh
      - name: Remove temporary signing credentials before executing bundled code
        if: ${{ always() && inputs.signed_release }}
        run: bash scripts/cleanup_apple_credentials.sh
      - name: Sign exact updater archive with the locked CLI
        if: inputs.signed_release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version '${{ needs.build.outputs.version }}' 'artifacts/fairway-xmp-${{ needs.build.outputs.version }}-macos-arm64.app.tar.gz'
      - name: Verify signed PHP and native permissions after credential cleanup
        if: inputs.signed_release
        run: |
          app='src-tauri/target/release/bundle/macos/Fairway XMP.app'
          python scripts/check_signed_php.py "$app"
          python scripts/verify_macos_permissions.py "$app" --team-id 4Q27NQ2UAF
          "$app/Contents/MacOS/fairway" --test-native-hosts-registration
      - name: Package unsigned development installer
        if: ${{ !inputs.signed_release }}
        run: sh scripts/package_macos.sh
      - name: Collect exact release artifacts
        id: installer
        env:
          SIGNED_RELEASE: ${{ inputs.signed_release }}
        run: |
          mkdir -p artifacts/macos-installer
          version='${{ needs.build.outputs.version }}'
          if [ "$SIGNED_RELEASE" = true ]; then
            name="fairway-xmp-$version-macos-arm64.pkg"
            mv "artifacts/$name" "artifacts/fairway-xmp-$version-macos-arm64.app.tar.gz" "artifacts/fairway-xmp-$version-macos-arm64.app.tar.gz.sig" artifacts/macos-installer/
            echo 'signing=apple-notarized' >> "$GITHUB_OUTPUT"
          else
            name="fairway-xmp-$version-macos-arm64-unsigned.pkg"
            mv "artifacts/$name" artifacts/macos-installer/
            echo 'signing=unsigned' >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Test actual installer, signed updater and data-preserving removal
        shell: bash
        run: |
          extra=()
          if [ '${{ inputs.signed_release }}' = true ]; then
            extra=(--updater "artifacts/macos-installer/fairway-xmp-${{ needs.build.outputs.version }}-macos-arm64.app.tar.gz" --update-probe src-tauri/target/release/examples/updater_probe)
          fi
          python tests/installer_lifecycle.py "${extra[@]}" --installer "artifacts/macos-installer/${{ steps.installer.outputs.name }}" --baseline .runtime-work/baseline-macos.pkg --probe src-tauri/target/release/examples/installer_probe --output .runtime-work/macos-lifecycle --allow-user-profile-changes
      - name: Collect exact application and bundled-tool sources
        run: |
          cp "artifacts/sources-${{ needs.build.outputs.version }}/fairway-xmp-${{ needs.build.outputs.version }}-bundled-tool-sources.tar.gz" artifacts/macos-installer/
          git archive --format=tar.gz --output="artifacts/macos-installer/fairway-xmp-${{ needs.build.outputs.version }}-build-source.tar.gz" HEAD
          cp LICENSE THIRD_PARTY_NOTICES.md runtime-manifest.json runtime-downloads.lock.json artifacts/macos-installer/
          python scripts/release_candidate.py record --target macos-arm64 --signing ${{ steps.installer.outputs.signing }} --directory artifacts/macos-installer --artifact fairway-xmp-macos-arm64-${{ needs.build.outputs.version }} --lifecycle .runtime-work/macos-lifecycle/lifecycle.json --output artifacts/candidate-metadata/candidate-macos-arm64.json
      - uses: actions/upload-artifact@v6
        with:
          name: fairway-xmp-macos-arm64-${{ needs.build.outputs.version }}
          path: artifacts/macos-installer/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v6
        with:
          name: candidate-metadata-macos-arm64
          path: artifacts/candidate-metadata/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve signed files for investigating a failed lifecycle
        if: ${{ failure() && inputs.signed_release }}
        uses: actions/upload-artifact@v6
        with:
          name: macos-signed-build-for-investigation-${{ github.sha }}
          path: |
            artifacts/macos-installer/*.pkg
            artifacts/macos-installer/*.app.tar.gz
            artifacts/macos-installer/*.sig
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: macos-packaging-diagnostics
          path: |
            .runtime-work/macos-smoke/student data/logs/*.log
            .runtime-work/macos-lifecycle/*.json
            .runtime-work/macos-lifecycle/*.txt
          if-no-files-found: ignore
          retention-days: 7

  standalone:
    if: inputs.standalone_only == true
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve comparison source before checking it out
        id: source
        env:
          SOURCE_REF: ${{ inputs.test_source_ref || github.sha }}
        run: |
          commit=$(python scripts/verify_signing_source.py --source "$SOURCE_REF")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/configure-macos-build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: installer-complete-v1
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: false
      - run: npm ci --no-audit --no-fund
      - uses: ./.github/actions/restore-runtime-downloads
        id: downloads
      - run: python scripts/prepare_runtime.py
      - uses: actions/cache/save@v5
        if: steps.downloads.outputs.cache-hit != 'true'
        with:
          path: .runtime-cache
          key: ${{ steps.downloads.outputs.key }}
      - name: Fetch pinned Mac dependencies for the offline helper build
        run: |
          test "$(uname -m)" = arm64
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
      - name: Build native hosts helper
        env:
          CARGO_TERM_COLOR: never
        run: python scripts/build_macos_hosts_helper.py --team-id 4Q27NQ2UAF --output artifacts/hosts-helper
      - name: Build standalone desktop app with native permissions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('artifacts/permissions-build.json').write_text(json.dumps({'app': {'windows': [{'title': 'Fairway XMP — Native Permissions Prototype', 'width': 1080, 'height': 760, 'minWidth': 820, 'minHeight': 650}]}}))
          PY
          npm run tauri -- build --bundles app --features native-macos-trust,native-macos-hosts --config artifacts/permissions-build.json --no-sign
          ditto artifacts/hosts-helper/Library 'src-tauri/target/release/bundle/macos/Fairway XMP.app/Contents/Library'
      - name: Transfer unsigned standalone app
        run: tar -czf artifacts/macos-standalone-inputs.tar.gz 'src-tauri/target/release/bundle/macos/Fairway XMP.app'
      - uses: actions/upload-artifact@v6
        with:
          name: macos-standalone-inputs
          path: artifacts/macos-standalone-inputs.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  sign-standalone:
    needs: standalone
    if: inputs.standalone_only == true
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.standalone.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked signing tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify signing source is merged into main
        run: python scripts/verify_signing_source.py --expected ${{ needs.standalone.outputs.commit }}
      - uses: actions/download-artifact@v7
        with:
          name: macos-standalone-inputs
          path: artifacts
      - name: Restore unsigned standalone app
        run: tar -xzf artifacts/macos-standalone-inputs.tar.gz
      - name: Import Apple signing and notarization credentials
        env:
          APPLE_CERTIFICATES_P12: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/import_apple_credentials.sh
      - name: Sign, notarize, staple and verify standalone app
        run: |
          app='src-tauri/target/release/bundle/macos/Fairway XMP.app'
          python scripts/sign_macos.py "$app" 'Developer ID Application: Ei Maung (4Q27NQ2UAF)'
          codesign --verify --strict '-R=anchor apple generic and identifier "dev.fairway.environment.hosts-helper" and certificate leaf[subject.OU] = "4Q27NQ2UAF"' "$app/Contents/Library/HelperTools/dev.fairway.environment.hosts-helper"
          mkdir -p artifacts/macos-standalone
          ditto -c -k --keepParent "$app" artifacts/macos-notary-upload.zip
          xcrun notarytool submit artifacts/macos-notary-upload.zip --keychain-profile "$APPLE_NOTARY_PROFILE" --keychain "$APPLE_NOTARY_KEYCHAIN" --wait --timeout 30m | tee artifacts/macos-standalone/notarization.txt
          python scripts/staple_macos.py "$app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Remove temporary Apple credentials before executing bundled code
        if: always()
        run: bash scripts/cleanup_apple_credentials.sh
      - name: Verify signed PHP after credential cleanup
        run: python scripts/check_signed_php.py 'src-tauri/target/release/bundle/macos/Fairway XMP.app'
      - name: Verify fresh native helper registration without approval or hosts writes
        run: '"src-tauri/target/release/bundle/macos/Fairway XMP.app/Contents/MacOS/fairway" --test-native-hosts-registration'
      - name: Diagnose failed native registration
        if: failure()
        run: /usr/bin/log show --last 5m --style compact --predicate 'subsystem == "com.apple.backgroundtaskmanagement" AND eventMessage CONTAINS "dev.fairway.environment.hosts-helper"'
      - name: Package standalone app and exact build identity
        id: metadata
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          app = Path('src-tauri/target/release/bundle/macos/Fairway XMP.app')
          output = Path('artifacts/macos-standalone')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          info = json.loads(subprocess.check_output([str(app / 'Contents/MacOS/fairway'), '--build-info']))
          assert info['commit'] == commit and not info['modifiedSources']
          info['notarization'] = 'accepted and stapled; Gatekeeper verified'
          (output / 'BUILD-INFO.json').write_text(json.dumps(info, indent=2) + '\n')
          # Preserve the recognizable prototype filename when extracting the test ZIP.
          stage = Path('artifacts/macos-standalone-stage')
          stage.mkdir()
          prototype = stage / 'Fairway XMP Permissions Prototype.app'
          subprocess.run(['ditto', str(app), str(prototype)], check=True)
          archive = output / f'fairway-xmp-permissions-{commit[:8]}-macos-arm64.zip'
          subprocess.run(['ditto', '-c', '-k', '--keepParent', str(prototype), str(archive)], check=True)
          with archive.open('rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          (output / 'SHA256SUMS.txt').write_text(f'{digest}  {archive.name}\n')
          (output / 'TESTING.md').write_bytes(Path('docs/testing.md').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as env:
              env.write(f'commit={commit}\n')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: fairway-xmp-macos-permissions-${{ steps.metadata.outputs.commit }}
          path: artifacts/macos-standalone/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

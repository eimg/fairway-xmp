name: Linux terminal installer

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install build dependencies (not needed on target machines)
        run: |
          awk '$1 == "deb" { $1="deb-src"; print }' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/fairway-sources.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf bison re2c pkg-config patchelf libxml2-dev libssl-dev libcurl4-openssl-dev libsqlite3-dev libonig-dev libzip-dev libsodium-dev libicu-dev libpng-dev libjpeg-dev libwebp-dev libfreetype6-dev libpcre2-dev zlib1g-dev libaio1 libnuma1 libncurses5
      - name: Verify application version consistency
        id: metadata
        run: |
          version=$(python scripts/release_candidate.py version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$version"
      - name: Packaging tests
        run: python -m unittest discover -s tests -v
      - name: Rust format, tests and lint
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features cli --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features cli --all-targets --locked -- -D warnings
      - uses: actions/cache/restore@v5
        id: runtime-cache
        with:
          path: |
            src-tauri/resources/runtime
            .runtime-work/linux-sources
          key: linux-glibc235-${{ hashFiles('runtime-linux-downloads.lock.json', 'runtime-manifest.json', 'scripts/prepare_runtime.py', 'scripts/prepare_linux_runtime.py') }}
      - name: Prepare portable Linux runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare_runtime.py --lockfile runtime-linux-downloads.lock.json
      - name: Verify staged runtime
        run: python scripts/prepare_runtime.py --verify-only
      - uses: actions/cache/save@v5
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: |
            src-tauri/resources/runtime
            .runtime-work/linux-sources
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Build terminal binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --no-default-features --features cli --bin fairway-cli --locked
      - name: Exercise service manager and database recovery
        run: cargo run --manifest-path src-tauri/Cargo.toml --example smoke --no-default-features --locked -- "$PWD/.runtime-work/linux-smoke"
      - name: Package offline installer and corresponding sources
        run: python scripts/package_linux.py
      - name: Test installed CLI, alpha upgrade, supervisor and terminal dashboard
        run: |
          python scripts/fetch_installer_baseline.py linux --output .runtime-work/baseline-linux.run
          python tests/linux_cli_smoke.py artifacts/linux-installer/fairway-xmp-*-linux-x86_64.run --baseline .runtime-work/baseline-linux.run --report .runtime-work/linux-lifecycle/lifecycle.json
          python scripts/release_candidate.py record --target linux-x86_64 --directory artifacts/linux-installer --artifact fairway-xmp-linux-x86_64-${{ steps.metadata.outputs.version }} --lifecycle .runtime-work/linux-lifecycle/lifecycle.json --output artifacts/candidate-metadata/candidate-linux-x86_64.json
      - uses: actions/upload-artifact@v6
        with:
          name: candidate-metadata-linux-x86_64
          path: artifacts/candidate-metadata/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v6
        with:
          name: fairway-xmp-linux-x86_64-${{ steps.metadata.outputs.version }}
          path: |
            artifacts/linux-installer/*.run
            artifacts/linux-installer/fairway-xmp-*-x86_64.tar.gz
            artifacts/linux-installer/SHA256SUMS.txt
            artifacts/linux-installer/build-info.json
            artifacts/linux-installer/candidate-info.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v6
        with:
          name: fairway-xmp-linux-x86_64-${{ steps.metadata.outputs.version }}-sources
          path: artifacts/linux-installer/*-sources.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: linux-build-diagnostics
          path: |
            .runtime-work/linux-build/**/config.log
            .runtime-work/linux-smoke/student data/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  portable-runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:bookworm-slim', 'fedora:latest', 'archlinux:base']
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: fairway-xmp-linux-x86_64-${{ needs.build.outputs.version }}
          path: artifacts
      - name: Extract manual-install bundle
        run: tar -xzf artifacts/fairway-xmp-*-linux-x86_64.tar.gz
      - name: Verify on a clean distro without installing runtime dependencies
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/fairway-xmp:/fairway:ro" -e HOME=/tmp/student -e XDG_DATA_HOME=/tmp/student/.local/share "$TEST_IMAGE" sh -ec '
            mkdir -p "$HOME"
            trap "/fairway/bin/fairway shutdown" EXIT
            /fairway/bin/fairway php -r "echo PHP_VERSION, PHP_EOL;"
            /fairway/bin/fairway composer --version
            /fairway/bin/fairway start
            /fairway/bin/fairway status
            /fairway/bin/fairway php -r '\''$page=file_get_contents("http://127.0.0.1:8800/"); if (!str_contains($page, "Your environment")) exit(1); $db=new PDO("mysql:host=127.0.0.1;port=13306;dbname=fairway", "fairway", "fairway"); echo $db->query("SELECT 42")->fetchColumn(), PHP_EOL;'\''
            /fairway/bin/fairway backup
            /fairway/bin/fairway stop
          '

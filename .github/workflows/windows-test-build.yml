name: Windows installer

on:
  workflow_call:
    inputs:
      signed_release:
        description: Enable signed updates (without Authenticode)
        type: boolean
        default: false
      record_runtime_checksums:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      standalone_only:
        description: Build a standalone permission-test ZIP without an installer
        type: boolean
        default: false
      signed_release:
        description: Enable signed updates (without Authenticode)
        type: boolean
        default: false
      record_runtime_checksums:
        description: Record Windows runtime download checksums for review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.standalone_only != true
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signing source is merged into main
        if: inputs.signed_release
        run: python scripts/verify_signing_source.py
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: installer-complete-v1
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: false
          save-if: ${{ github.ref_type != 'tag' }}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:scripts
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features terminal --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features cli --locked
      - name: Record release version
        id: metadata
        run: |
          $version = python scripts/release_candidate.py version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: ./.github/actions/restore-runtime-downloads
        id: downloads
      - name: Test Visual C++ prerequisite upgrade decisions
        run: ./tests/windows_vc_runtime.ps1
      - name: Install pinned Visual C++ runtime before PHP verification
        run: |
          if ('${{ inputs.record_runtime_checksums }}' -eq 'true') {
            python scripts/prepare_runtime.py --windows-prerequisites --resume-lock
          } else {
            python scripts/prepare_runtime.py --windows-prerequisites
          }
      - name: Prepare Windows runtime
        run: |
          if ('${{ inputs.record_runtime_checksums }}' -eq 'true') {
            python scripts/prepare_runtime.py --resume-lock
          } else {
            python scripts/prepare_runtime.py
          }
      - name: Verify fnm Node management in isolated storage
        run: cargo run --manifest-path src-tauri/Cargo.toml --example node_tools_windows_smoke --no-default-features --locked -- .runtime-work/fnm-windows-smoke
      - name: Verify shared desktop and console CLI with isolated real services
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin fairway --bin fairway-cli --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/shared_cli_smoke.py --cli src-tauri/target/debug/fairway-cli.exe --peer src-tauri/target/debug/fairway.exe --runtime src-tauri/resources/runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify persistent PHP settings and real uploads
        run: cargo run --manifest-path src-tauri/Cargo.toml --example php_settings_smoke --no-default-features --locked -- .runtime-work/php-settings-smoke
      - name: Verify PHP client extensions and Unix worker support
        run: cargo run --manifest-path src-tauri/Cargo.toml --example php_extension_smoke --no-default-features --locked -- .runtime-work/php-extension-smoke
      - name: Verify PHP clients with the runner's external PostgreSQL test server
        run: python scripts/check_postgres_clients.py
      - name: Build native terminal test bridge
        run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --features terminal --example terminal_bridge --locked
      - run: npx playwright install --only-shell chromium
      - name: Exercise native terminal, data browser and logs through browser input
        env:
          FAIRWAY_NATIVE_ONLY: '1'
          FAIRWAY_TEST_RUNTIME: ${{ github.workspace }}/src-tauri/resources/runtime
        run: npx playwright test tests/ui/terminal-native.spec.ts tests/ui/data-browser-native.spec.ts tests/ui/sqlite-browser-native.spec.ts tests/ui/schema-details-native.spec.ts tests/ui/logs-native.spec.ts tests/ui/php-settings-native.spec.ts --project chromium --workers=1
      - name: Save native desktop browser report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-desktop-windows-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise real services, backups, and PATH cleanup
        run: |
          $root = Join-Path (Get-Location) '.runtime-work/windows-smoke'
          cargo run --manifest-path src-tauri/Cargo.toml --example smoke --no-default-features --locked -- $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise native data browser and SQL export/import
        run: cargo run --manifest-path src-tauri/Cargo.toml --example data_browser_smoke --no-default-features --locked -- .runtime-work/data-browser-smoke
      - name: Exercise SQLite project files without services
        run: cargo run --manifest-path src-tauri/Cargo.toml --example sqlite_browser_smoke --no-default-features --locked -- .runtime-work/sqlite-browser-smoke
      - name: Verify SQLite workers across staged PHP versions
        run: python -m unittest discover -s tests -p test_sqlite_browser.py -v
      - name: Verify MySQL upgrade from alpha 1
        run: |
          $legacy = Join-Path (Get-Location) '.runtime-work/alpha1-runtime'
          python scripts/prepare_runtime.py --manifest tests/fixtures/runtime-alpha1-manifest.json --lockfile tests/fixtures/runtime-alpha1-downloads.lock.json --destination $legacy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = Join-Path (Get-Location) '.runtime-work/windows-upgrade'
          $current = Join-Path (Get-Location) 'src-tauri/resources/runtime'
          cargo run --manifest-path src-tauri/Cargo.toml --example smoke --no-default-features --locked -- $root $legacy $current
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v5
        if: github.ref_type != 'tag' && inputs.record_runtime_checksums != true && steps.downloads.outputs.cache-hit != 'true'
        with:
          path: .runtime-cache
          key: ${{ steps.downloads.outputs.key }}
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Check Windows bundle size
        run: |
          $runtimeFiles = @(Get-ChildItem 'src-tauri/resources/runtime' -File -Recurse)
          $bytes = ($runtimeFiles | Measure-Object -Property Length -Sum).Sum
          Write-Host "Bundled runtime: $([math]::Round($bytes / 1MB, 1)) MiB"
          $debugFiles = @($runtimeFiles | Where-Object { $_.FullName -match '[\\/]mysql[\\/]' -and $_.Extension -in '.pdb', '.lib' })
          if ($debugFiles.Count -gt 0) { throw 'MySQL debug symbols or linker libraries remain in the bundle.' }
      - name: Prepare installer lifecycle probe and baseline before packaging
        if: inputs.record_runtime_checksums != true
        run: |
          python scripts/fetch_installer_baseline.py windows --output .runtime-work/baseline-windows.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --example installer_probe --manifest-path src-tauri/Cargo.toml --no-default-features --target x86_64-pc-windows-msvc --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native updater probe
        if: inputs.signed_release
        run: cargo build --release --example updater_probe --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --locked
      - name: Build Windows console entry point before collecting unsigned inputs
        run: node scripts/build_cli.mjs
      - name: Build updater-enabled x64 NSIS installer without credentials
        if: inputs.signed_release
        run: |
          python scripts/configure_release.py --public-key packaging/updater.pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run tauri -- build --bundles nsis --target x86_64-pc-windows-msvc --config artifacts/tauri.release.json --no-sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned development installer
        if: ${{ !inputs.signed_release }}
        run: npm run tauri -- build --bundles nsis --target x86_64-pc-windows-msvc
      - name: Stage installer and lifecycle inputs
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-build-inputs | Out-Null
          Copy-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' artifacts/windows-build-inputs/
          Copy-Item runtime-downloads.lock.json artifacts/windows-build-inputs/
          if ('${{ inputs.record_runtime_checksums }}' -ne 'true') {
            Copy-Item .runtime-work/baseline-windows.exe artifacts/windows-build-inputs/
            Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/examples/installer_probe.exe artifacts/windows-build-inputs/
          }
          if ('${{ inputs.signed_release }}' -eq 'true') {
            Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/examples/updater_probe.exe artifacts/windows-build-inputs/
          }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-build-inputs
          path: artifacts/windows-build-inputs/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Save build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-build-diagnostics
          path: |
            runtime-downloads.lock.json
            .runtime-work/windows-smoke/student data/logs/*.log
            .runtime-work/windows-upgrade/student data/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    needs: build
    if: inputs.standalone_only != true
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked signing tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify signing source is merged into main
        if: inputs.signed_release
        run: python scripts/verify_signing_source.py --expected ${{ needs.build.outputs.commit }}
      - uses: actions/download-artifact@v7
        with:
          name: windows-build-inputs
          path: artifacts/windows-build-inputs
      - name: Sign exact installer with the locked CLI
        if: inputs.signed_release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Updater signing key is required.' }
          $installers = @(Get-ChildItem 'artifacts/windows-build-inputs/*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version '${{ needs.build.outputs.version }}' $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect installer and checksums
        run: |
          $output = 'artifacts/windows-installer'
          New-Item -ItemType Directory -Force $output | Out-Null
          $installers = @(Get-ChildItem 'artifacts/windows-build-inputs/*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $version = '${{ needs.build.outputs.version }}'
          $filename = "fairway-xmp-$version-windows-x64-setup.exe"
          Copy-Item $installers[0].FullName (Join-Path $output $filename)
          if ('${{ inputs.signed_release }}' -eq 'true') {
            $signature = "$($installers[0].FullName).sig"
            if (-not (Test-Path $signature)) { throw 'Missing updater signature.' }
            Copy-Item $signature (Join-Path $output "$filename.sig")
          }
          Copy-Item artifacts/windows-build-inputs/runtime-downloads.lock.json, runtime-manifest.json, LICENSE, THIRD_PARTY_NOTICES.md $output
          $hash = Get-FileHash $installers[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $filename" | Set-Content "$output/SHA256SUMS.txt" -Encoding utf8
          git archive --format=tar.gz --output="$output/fairway-xmp-$version-build-source.tar.gz" HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{
            version = $version
            commit = '${{ github.sha }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            target = 'x86_64-pc-windows-msvc'
            signed = $false
            updaterSigned = '${{ inputs.signed_release }}' -eq 'true'
            installer = $filename
            sha256 = $hash.Hash.ToLower()
            runtime = Get-Content runtime-manifest.json -Raw | ConvertFrom-Json
            checks = @('frontend build', 'packaging tests', 'Rust tests and clippy', 'fresh runtime smoke', 'MySQL 8.4 to 9.7 upgrade, backup and restart')
            purpose = 'Release candidate installer; reuse this exact file after testing'
          } | ConvertTo-Json -Depth 8 | Set-Content "$output/build-info.json" -Encoding utf8
      - name: Verify installed upgrade and reinstall lifecycle
        if: inputs.record_runtime_checksums != true
        run: |
          $installer = (Get-ChildItem 'artifacts/windows-installer/*-setup.exe').FullName
          $extra = @()
          if ('${{ inputs.signed_release }}' -eq 'true') {
            $extra = @('--updater', $installer, '--update-probe', 'artifacts/windows-build-inputs/updater_probe.exe')
          }
          python tests/installer_lifecycle.py @extra --installer $installer --baseline artifacts/windows-build-inputs/baseline-windows.exe --probe artifacts/windows-build-inputs/installer_probe.exe --output .runtime-work/windows-lifecycle --allow-user-profile-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signing = if ('${{ inputs.signed_release }}' -eq 'true') { 'updater-only' } else { 'unsigned' }
          python scripts/release_candidate.py record --target windows-x64 --signing $signing --directory artifacts/windows-installer --artifact fairway-xmp-windows-x64-${{ needs.build.outputs.version }} --lifecycle .runtime-work/windows-lifecycle/lifecycle.json --output artifacts/candidate-metadata/candidate-windows-x64.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: inputs.record_runtime_checksums != true
        with:
          name: candidate-metadata-windows-x64
          path: artifacts/candidate-metadata/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v6
        with:
          name: fairway-xmp-windows-x64-${{ needs.build.outputs.version }}
          path: artifacts/windows-installer/
          if-no-files-found: error
          retention-days: 90
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-packaging-diagnostics
          path: |
            runtime-downloads.lock.json
            .runtime-work/windows-smoke/student data/logs/*.log
            .runtime-work/windows-upgrade/student data/logs/*.log
            .runtime-work/windows-lifecycle/*.json
          if-no-files-found: ignore
          retention-days: 7

# Manual installer builds. Publication reuses the tested artifact; no release creation.

  standalone:
    if: inputs.standalone_only == true
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: installer-complete-v1
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - uses: ./.github/actions/restore-runtime-downloads
        id: downloads
      - name: Test Visual C++ prerequisite upgrade decisions
        run: ./tests/windows_vc_runtime.ps1
      - name: Install pinned Visual C++ runtime before PHP verification
        run: python scripts/prepare_runtime.py --windows-prerequisites
      - run: python scripts/prepare_runtime.py
      - uses: actions/cache/save@v5
        if: steps.downloads.outputs.cache-hit != 'true'
        with:
          path: .runtime-cache
          key: ${{ steps.downloads.outputs.key }}
      - name: Exercise bundled services and backups with isolated data
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --example smoke --no-default-features --locked -- .runtime-work/standalone-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone desktop app
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @{ app = @{ windows = @(@{ title = 'Fairway XMP — Permissions Test'; width = 1080; height = 760; minWidth = 820; minHeight = 650 }) } } | ConvertTo-Json -Depth 5 | Set-Content artifacts/permissions-build.json -Encoding utf8
          npm run tauri -- build --no-bundle --target x86_64-pc-windows-msvc --config artifacts/permissions-build.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package app, complete runtime, identity and test guide
        run: |
          node scripts/build_cli.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_windows_standalone.py --executable src-tauri/target/x86_64-pc-windows-msvc/release/fairway.exe --output artifacts/windows-standalone
      - uses: actions/upload-artifact@v6
        with:
          name: fairway-xmp-windows-permissions-${{ github.sha }}
          path: artifacts/windows-standalone/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

name: Build and verify Fairway XMP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-review:
    uses: ./.github/workflows/ui-review.yml

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:scripts
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features terminal --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

name: Stage tested alpha 3 release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tested builds and stage draft assets without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/stage_reused_alpha.py

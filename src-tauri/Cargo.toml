[package]
name = "fairway"
version = "0.1.0-alpha.3"
description = "A consistent PHP development environment for the classroom"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/eimg/fairway-xmp"
homepage = "https://github.com/eimg/fairway-xmp"

[lib]
name = "fairway_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fairway"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "fairway-cli"
path = "src/cli_main.rs"
required-features = ["cli"]

[features]
default = ["desktop"]
cli = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-updater", "dep:muda", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rand = "0.9"
libc = "0.2"
tauri = { version = "~2.12", optional = true, features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20", optional = true, default-features = false }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["NSMenu", "NSMenuItem", "NSFont", "NSColor", "NSAttributedString"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["NSString", "NSAttributedString", "NSValue"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading"] }

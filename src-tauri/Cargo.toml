[package]
name = "fairway"
version = "0.1.0-rc.1"
description = "A consistent PHP development environment for the classroom"
edition = "2021"
default-run = "fairway"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/eimg/fairway-xmp"
homepage = "https://github.com/eimg/fairway-xmp"

[lib]
name = "fairway_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fairway"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "fairway-cli"
path = "src/cli_main.rs"
required-features = ["cli"]

[[example]]
name = "terminal_bridge"
required-features = ["terminal"]

[features]
default = ["desktop"]
cli = []
desktop = ["terminal", "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-updater", "dep:tauri-plugin-dialog", "dep:muda", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
terminal = ["dep:portable-pty"]
native-macos-hosts = ["desktop"]
native-hosts-writer = []
native-macos-trust = ["dep:core-foundation", "dep:pem", "dep:security-framework", "dep:security-framework-sys"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rand = "0.9"
libc = "0.2"
portable-pty = { version = "0.9", optional = true }
tauri = { version = "~2.12", optional = true, features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
rcgen = { version = "0.14.10", features = ["x509-parser"] }
time = "0.3"
ring = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "=0.10.1", optional = true }
pem = { version = "=4.0.0", optional = true }
security-framework = { version = "=3.7.0", optional = true }
security-framework-sys = { version = "=2.17.0", optional = true }
muda = { version = "0.20", optional = true, default-features = false }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSFont", "NSColor", "NSAttributedString"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["NSString", "NSAttributedString", "NSValue", "NSError"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Threading"] }

[[example]]
name = "updater_probe"
required-features = ["desktop"]

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"
